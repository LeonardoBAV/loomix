name: Fix Code Style With Laravel Pint

on: 
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: pint

      - name: Run Pint
        run: pint --test
