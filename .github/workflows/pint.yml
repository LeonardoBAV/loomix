name: CI - Pint

on:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pint

      - name: Run Pint
        run: pint

      - name: Commit Pint Fixed Files
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: CI - Pint Fixed
