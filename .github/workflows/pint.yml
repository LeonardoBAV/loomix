name: CI - Pint

on:
  push:
    branches:
      - develop

jobs:
  pint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup
        with:
          php-version: "8.4"
          php-extensions: "json, dom, curl, libxml, mbstring"

      - name: Install Pint
        run: composer global require laravel/pint

      - name: Run Pint
        run: pint

      - name: Commit of Pint
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: CI - Pint Fixed
